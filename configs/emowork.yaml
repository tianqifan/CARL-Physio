dataset:
  name: EmoWork
  task: binary valence recognition
  num_classes: 2
  input_length: 2560
  sampling_rate_hz: 256
  window_seconds: 10
  overlap: 0
  modalities:
    - {name: EEG, channels: [0, 1, 2, 3]}
    - {name: ECG, channels: [4]}
    - {name: EDA, channels: [5]}
    - {name: BVP, channels: [6]}
    - {name: TEMP, channels: [7]}
model:
  fusion_blocks: [3, 4, 5]
  relationship_blocks: [3, 4, 5]
  num_heads: 4
  graph_alpha: 2.0
  relation_beta: 0.5
  attention_bias_scale: 0.5
  graph_residual_weight: 0.2
  graph_temperature_initial: 6.0
  relationship_warmup_epochs: 3
  relationship_momentum: 0.9
loss:
  reconstruction: 0.1
  orthogonality: 0.1
  semantic: 1.0
training:
  seed: 2025
  epochs: 50
  batch_size: 256
  learning_rate: 0.001
  gradient_clip_norm: 1.0
  device: cuda
